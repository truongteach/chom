<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANTRUONG CHOM - Learning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Small custom animation for card hovering */
        .quiz-card {
            transition: all 0.2s ease-in-out;
        }
        .quiz-card:hover {
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-lg py-10 px-6 mb-10">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between">
            <div>
                <h2 class="text-indigo-200 text-sm font-bold tracking-widest uppercase mb-1">DANTRUONG CHOM</h2>
                <h1 class="text-4xl font-extrabold tracking-tight mb-2">Knowledge Assessment Portal</h1>
                <p class="text-indigo-100 text-lg">Select a module below to begin your test. Good luck!</p>
            </div>
            <div class="mt-6 md:mt-0 hidden md:flex items-center justify-center bg-white text-indigo-700 font-black text-2xl h-16 w-16 rounded-full shadow-md">
                DC
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 flex-grow">

        <section class="mb-12">
            <div class="flex items-center mb-6">
                <span class="bg-emerald-100 text-emerald-800 text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wide mr-3">Beginner</span>
                <h2 class="text-2xl font-bold text-slate-800">Level 1 Modules</h2>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <script>
                    for(let i=1; i<=5; i++) {
                        let num = i.toString().padStart(2, '0');
                        document.write(`
                        <a href="LV1_${num}_MOD.html" class="quiz-card block bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-xl overflow-hidden group">
                            <div class="h-2 bg-emerald-500"></div>
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-4">
                                    <div class="bg-emerald-50 p-2 rounded-lg text-emerald-600 group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    </div>
                                    <span class="text-xs font-semibold text-slate-400">Mod ${num}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 mb-1">Quiz 1.${i}</h3>
                                <p class="text-sm text-slate-500 mb-4">Core fundamentals and basic concepts.</p>
                                <span class="text-emerald-600 text-sm font-medium flex items-center">
                                    Start Test 
                                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </span>
                            </div>
                        </a>`);
                    }
                </script>
            </div>
        </section>

        <section class="mb-12">
            <div class="flex items-center mb-6">
                <span class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wide mr-3">Intermediate</span>
                <h2 class="text-2xl font-bold text-slate-800">Level 2 Modules</h2>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <script>
                    for(let i=1; i<=5; i++) {
                        let num = i.toString().padStart(2, '0');
                        document.write(`
                        <a href="LV2_${num}_MOD.html" class="quiz-card block bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-xl overflow-hidden group">
                            <div class="h-2 bg-blue-500"></div>
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-4">
                                    <div class="bg-blue-50 p-2 rounded-lg text-blue-600 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                    </div>
                                    <span class="text-xs font-semibold text-slate-400">Mod ${num}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 mb-1">Quiz 2.${i}</h3>
                                <p class="text-sm text-slate-500 mb-4">Applied knowledge and intermediate logic.</p>
                                <span class="text-blue-600 text-sm font-medium flex items-center">
                                    Start Test 
                                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </span>
                            </div>
                        </a>`);
                    }
                </script>
            </div>
        </section>

        <section class="mb-12">
            <div class="flex items-center mb-6">
                <span class="bg-purple-100 text-purple-800 text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wide mr-3">Advanced</span>
                <h2 class="text-2xl font-bold text-slate-800">Level 3 Modules</h2>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <script>
                    for(let i=1; i<=5; i++) {
                        let num = i.toString().padStart(2, '0');
                        document.write(`
                        <a href="LV3_${num}_MOD.html" class="quiz-card block bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-xl overflow-hidden group">
                            <div class="h-2 bg-purple-500"></div>
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-4">
                                    <div class="bg-purple-50 p-2 rounded-lg text-purple-600 group-hover:bg-purple-500 group-hover:text-white transition-colors">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                    </div>
                                    <span class="text-xs font-semibold text-slate-400">Mod ${num}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 mb-1">Quiz 3.${i}</h3>
                                <p class="text-sm text-slate-500 mb-4">Complex problems and deep evaluations.</p>
                                <span class="text-purple-600 text-sm font-medium flex items-center">
                                    Start Test 
                                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </span>
                            </div>
                        </a>`);
                    }
                </script>
            </div>
        </section>

    </main>

    <footer class="bg-slate-100 border-t border-slate-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-slate-500 text-sm font-medium">
                &copy; <script>document.write(new Date().getFullYear())</script> <strong>DANTRUONG CHOM</strong>. All rights reserved.
            </p>
        </div>
    </footer>

</body>
</html>
